# Faucet Configuration for DDoS Detection Topology
# 6 Switches, 18 Hosts, OpenFlow 1.3
# Compatible with Faucet 1.9+

# Global settings
version: 2
meters: {}

dps:
  # Switch s1 - Core switch connecting to hosts h1-h3
  s1:
    dp_id: 0x1
    hardware: "Open vSwitch"
    interfaces:
      1:
        name: "h1"
        description: "Host h1 (Web Server)"
        native_vlan: 100
        acls_in: [protect-web-server]
      2:
        name: "h2"
        description: "Host h2"
        native_vlan: 100
      3:
        name: "h3"
        description: "Host h3"
        native_vlan: 100
      4:
        name: "s1-s2"
        description: "Link to s2"
        tagged_vlans: [100, 200, 300, 400, 500]

  # Switch s2 - Connecting hosts h4-h6
  s2:
    dp_id: 0x2
    hardware: "Open vSwitch"
    interfaces:
      1:
        name: "h4"
        description: "Host h4"
        native_vlan: 200
      2:
        name: "h5"
        description: "Host h5"
        native_vlan: 200
      3:
        name: "h6"
        description: "Host h6"
        native_vlan: 200
      4:
        name: "s2-s1"
        description: "Link to s1"
        tagged_vlans: [100, 200, 300, 400, 500]
      5:
        name: "s2-s3"
        description: "Link to s3"
        tagged_vlans: [100, 200, 300, 400, 500]

  # Switch s3 - Connecting hosts h7-h9
  s3:
    dp_id: 0x3
    hardware: "Open vSwitch"
    interfaces:
      1:
        name: "h7"
        description: "Host h7"
        native_vlan: 300
      2:
        name: "h8"
        description: "Host h8"
        native_vlan: 300
      3:
        name: "h9"
        description: "Host h9"
        native_vlan: 300
      4:
        name: "s3-s2"
        description: "Link to s2"
        tagged_vlans: [100, 200, 300, 400, 500]
      5:
        name: "s3-s4"
        description: "Link to s4"
        tagged_vlans: [100, 200, 300, 400, 500]

  # Switch s4 - Connecting hosts h10-h12
  s4:
    dp_id: 0x4
    hardware: "Open vSwitch"
    interfaces:
      1:
        name: "h10"
        description: "Host h10"
        native_vlan: 400
      2:
        name: "h11"
        description: "Host h11"
        native_vlan: 400
      3:
        name: "h12"
        description: "Host h12"
        native_vlan: 400
      4:
        name: "s4-s3"
        description: "Link to s3"
        tagged_vlans: [100, 200, 300, 400, 500]
      5:
        name: "s4-s5"
        description: "Link to s5"
        tagged_vlans: [100, 200, 300, 400, 500]

  # Switch s5 - Connecting hosts h13-h15
  s5:
    dp_id: 0x5
    hardware: "Open vSwitch"
    interfaces:
      1:
        name: "h13"
        description: "Host h13"
        native_vlan: 500
      2:
        name: "h14"
        description: "Host h14"
        native_vlan: 500
      3:
        name: "h15"
        description: "Host h15"
        native_vlan: 500
      4:
        name: "s5-s4"
        description: "Link to s4"
        tagged_vlans: [100, 200, 300, 400, 500]
      5:
        name: "s5-s6"
        description: "Link to s6"
        tagged_vlans: [100, 200, 300, 400, 500]

  # Switch s6 - Connecting hosts h16-h18
  s6:
    dp_id: 0x6
    hardware: "Open vSwitch"
    interfaces:
      1:
        name: "h16"
        description: "Host h16"
        native_vlan: 100
      2:
        name: "h17"
        description: "Host h17"
        native_vlan: 100
      3:
        name: "h18"
        description: "Host h18"
        native_vlan: 100
      4:
        name: "s6-s5"
        description: "Link to s5"
        tagged_vlans: [100, 200, 300, 400, 500]

# VLAN definitions
vlans:
  100:
    name: "vlan100"
    description: "Segment 1 (h1-h3, h16-h18)"
    faucet_vips: ["10.0.0.1/24"]
    faucet_mac: "00:00:00:00:00:01"
  200:
    name: "vlan200"
    description: "Segment 2 (h4-h6)"
    faucet_vips: ["10.0.0.4/24"]
    faucet_mac: "00:00:00:00:00:04"
  300:
    name: "vlan300"
    description: "Segment 3 (h7-h9)"
    faucet_vips: ["10.0.0.7/24"]
    faucet_mac: "00:00:00:00:00:07"
  400:
    name: "vlan400"
    description: "Segment 4 (h10-h12)"
    faucet_vips: ["10.0.0.10/24"]
    faucet_mac: "00:00:00:00:00:0a"
  500:
    name: "vlan500"
    description: "Segment 5 (h13-h15)"
    faucet_vips: ["10.0.0.13/24"]
    faucet_mac: "00:00:00:00:00:0d"

# ACLs for DDoS Mitigation
acls:
  # Protect web server (h1) from DDoS
  protect-web-server:
    - rule:
        dl_type: 0x800  # IPv4
        nw_dst: "10.0.0.1/32"
        actions:
          allow: true
          meter: "web-server-rate-limit"
    - rule:
        dl_type: 0x800
        nw_dst: "10.0.0.1/32"
        ip_proto: 1  # ICMP
        actions:
          allow: true
          meter: "icmp-rate-limit"
    - rule:
        dl_type: 0x800
        nw_dst: "10.0.0.1/32"
        ip_proto: 6  # TCP
        tp_dst: 80   # HTTP
        actions:
          allow: true
          meter: "http-rate-limit"
    - rule:
        dl_type: 0x800
        nw_dst: "10.0.0.1/32"
        ip_proto: 17 # UDP
        actions:
          allow: true
          meter: "udp-rate-limit"

  # Block malicious traffic (dynamically updated by ML service)
  block-malicious:
    - rule:
        actions:
          allow: false
        cookie: 0xdeadbeef

  # Default allow for legitimate traffic
  default-allow:
    - rule:
        actions:
          allow: true

# Meters for rate limiting (packets per second)
meters:
  web-server-rate-limit:
    meter_id: 1
    entry:
      flags: "KBPS"
      bands:
        - type: "DROP"
          rate: 10000  # 10 Mbps
          burst_size: 1000
  icmp-rate-limit:
    meter_id: 2
    entry:
      flags: "PKTPS"
      bands:
        - type: "DROP"
          rate: 100    # 100 pps ICMP
          burst_size: 50
  http-rate-limit:
    meter_id: 3
    entry:
      flags: "PKTPS"
      bands:
        - type: "DROP"
          rate: 500    # 500 pps HTTP
          burst_size: 200
  udp-rate-limit:
    meter_id: 4
    entry:
      flags: "PKTPS"
      bands:
        - type: "DROP"
          rate: 200    # 200 pps UDP
          burst_size: 100

# Router configuration (for inter-VLAN routing)
routers:
  router-1:
    vlans: [100, 200, 300, 400, 500]

# Faucet controller settings
controller:
  of_port: 6653
  metrics_rate_limit_sec: 10
  event_sock: "/var/run/faucet/faucet_event.sock"
  prometheus_port: 9302
  prometheus_addr: "0.0.0.0"
  ryu_app_list:
    - "faucet.faucet"
    - "faucet.valve_manager"

# Learning settings
learn_ban_timeout: 10
learn_jitter: 10
max_hosts_per_vlan: 255
max_hosts_per_dp: 255
timeout: 300
arp_neighbor_timeout: 250
use_idle_timeout: true
idle_timeout: 90