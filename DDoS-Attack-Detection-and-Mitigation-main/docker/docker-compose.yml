version: '3.8'

services:
  # Faucet SDN Controller
  faucet:
    image: faucet/faucet:latest
    container_name: faucet-controller
    ports:
      - "6653:6653"    # OpenFlow
      - "9302:9302"    # Prometheus metrics
      - "9303:9303"    # Gauge metrics
    volumes:
      - ./faucet_config:/etc/faucet
      - ./gauge_config:/etc/gauge
      - /var/log/faucet:/var/log/faucet
    environment:
      - FAUCET_CONFIG=/etc/faucet/faucet.yaml
      - FAUCET_LOG_LEVEL=INFO
      - GAUGE_CONFIG=/etc/gauge/gauge.yaml
    networks:
      - sdn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9302/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - sdn-network
    restart: unless-stopped

  # Pushgateway for ML service metrics
  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    ports:
      - "9091:9091"
    networks:
      - sdn-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - sdn-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # ML Detection Service
  ml-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ml
    container_name: ddos-ml-service
    ports:
      - "8080:8080"    # REST API
      - "50051:50051"  # gRPC
      - "9090:9090"    # Prometheus metrics
    volumes:
      - ./ml_service:/app/ml_service
      - ./models:/app/models
      - ./data:/app/data
      - /var/log/ml-service:/var/log/ml-service
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8080
      - GRPC_PORT=50051
      - LOG_LEVEL=INFO
      - MODEL_DIR=/app/models
      - DEFAULT_MODEL=RandomForest
      - DATASET_PATH=/app/data/FlowStatsfile.csv
      - FAUCET_HOST=faucet
      - FAUCET_REST_PORT=9302
      - GAUGE_PROMETHEUS_PORT=9303
      - FAUCET_ACL_NAME=block-malicious
      - STATS_POLL_INTERVAL=10
      - DDOS_THRESHOLD_PERCENT=20.0
      - MITIGATION_COOLDOWN=300
      - METRICS_ENABLED=true
      - METRICS_PORT=9090
    networks:
      - sdn-network
    restart: unless-stopped
    depends_on:
      - faucet
      - prometheus
      - pushgateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Integration Bridge (polling Gauge -> ML -> Faucet)
  ml-bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ml
    container_name: ddos-ml-bridge
    command: python -m integration.faucet_ml_bridge
    volumes:
      - ./ml_service:/app/ml_service
      - ./integration:/app/integration
      - ./models:/app/models
      - ./data:/app/data
      - /var/log/ml-bridge:/var/log/ml-bridge
    environment:
      - MODEL_DIR=/app/models
      - DEFAULT_MODEL=RandomForest
      - DATASET_PATH=/app/data/FlowStatsfile.csv
      - FAUCET_HOST=faucet
      - FAUCET_REST_PORT=9302
      - GAUGE_PROMETHEUS_PORT=9303
      - FAUCET_ACL_NAME=block-malicious
      - STATS_POLL_INTERVAL=10
      - DDOS_THRESHOLD_PERCENT=20.0
      - MITIGATION_COOLDOWN=300
    networks:
      - sdn-network
    restart: unless-stopped
    depends_on:
      - faucet
      - ml-service

  # Mininet Network Emulator (for testing)
  mininet:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mininet
    container_name: mininet
    privileged: true
    volumes:
      - ./mininet:/app/mininet
      - /lib/modules:/lib/modules
    environment:
      - PYTHONPATH=/app
    networks:
      - sdn-network
    command: sleep infinity
    profiles:
      - testing

networks:
  sdn-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data: